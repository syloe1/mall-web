# =============================================================================
# Mall 站点 Nginx 配置 —— 生产（Ubuntu nginx 1.18）
#
# 部署：
#   sudo cp mall-nginx.conf /etc/nginx/conf.d/mall.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 域名：mall.syloe1.xyz（Cloudflare 隧道 → 127.0.0.1:80 → 本 server 块）
# 前端：/home/wk/mall-web（npm run build 产物）
# 后端：127.0.0.1:3002（mall-web，systemd）
#
# 本文件同时承载审计要求的：
#   - 全站安全响应头（HSTS / CSP / nosniff / DENY / Referrer / Permissions / COOP）
#   - 鉴权接口 Cache-Control: no-store
#   - 公开商品接口短缓存 + stale-while-revalidate
#   - robots.txt / sitemap.xml 真实静态文件（不再是 SPA HTML）
#   - 未知路径返回真实 404（修复 SPA soft 404），并保留站内 404 页面
#   - /admin 加 X-Robots-Tag: noindex
# =============================================================================

# SPA 路由白名单：只有这些路径才回退到 index.html，其余返回 404。
# （nginx 的 map 必须位于 http 上下文，conf.d/*.conf 正好被 include 在 http 内）
# Cloudflare 隧道在边缘终止 TLS：真实客户端 IP 由 CF-Connecting-IP 透传。
# 没有该头时（本机 curl/内网）回落到 $remote_addr，避免把边缘节点 IP 当成用户 IP。
map $http_cf_connecting_ip $mall_real_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

map $uri $mall_spa_fallback {
    default 0;
    ~^/$                    1;
    ~^/products(/[0-9]+)?/?$ 1;
    ~^/search/?$            1;
    ~^/seckill/?$           1;
    ~^/login/?$             1;
    ~^/register/?$          1;
    ~^/about/?$             1;
    ~^/profile/?$           1;
    ~^/addresses/?$         1;
    ~^/cart/?$              1;
    ~^/checkout/?$          1;
    ~^/payment/?$           1;
    ~^/order-success/?$     1;
    ~^/orders/?$            1;
    ~^/favorites/?$         1;
    ~^/admin/?$             1;
}

server {
    listen      127.0.0.1:80;
    server_name mall.syloe1.xyz;

    root  /home/wk/mall-web;
    index index.html;

    charset       utf-8;
    server_tokens off;
    client_max_body_size 20m;

    # 2C2G 上开启 gzip：前端产物大量文本，压缩后省带宽也省内存
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # ---- 基础安全响应头（所有响应）----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # 404 页面：构建时生成的 SPA 外壳副本（浏览器仍会启动 Vue，路由渲染 NotFound 页）
    error_page 404 /404.html;

    # ---- 前端静态资源 + SPA 路由回退 ----
    location / {
        try_files $uri $uri.html $uri/ @mall_spa;
    }

    location @mall_spa {
        if ($mall_spa_fallback = 0) {
            return 404;
        }
        rewrite ^ /index.html last;
    }

    # 入口 HTML：不缓存，保证发版后立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # 带内容 hash 的构建产物：可长缓存（文件名变了才会重新请求）
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 商品图（自托管 SVG）：长缓存
    location /img/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # ---- SEO / 分享静态文件：真实 200 + 正确 content-type ----
    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # ---- 管理后台：不收录 ----
    location = /admin {
        try_files /index.html =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # ---- 鉴权接口：禁止缓存敏感响应 ----
    location ~ ^/api/v1/users/(login|register|refresh-token|logout)$ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $mall_real_client_ip;
        proxy_set_header X-Forwarded-For   $mall_real_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # ---- 公开商品列表 / 分类：短缓存 + 过期后台刷新 ----
    location = /api/v1/products {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $mall_real_client_ip;
        proxy_set_header X-Forwarded-For   $mall_real_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "public, max-age=30, stale-while-revalidate=60" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /api/v1/categories {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $mall_real_client_ip;
        proxy_set_header X-Forwarded-For   $mall_real_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=600" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- API：保留 /api 前缀转发给 Go（其余接口一律不缓存）----
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $mall_real_client_ip;
        proxy_set_header X-Forwarded-For   $mall_real_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # ---- 静态资源（头像等）：保留 /static 前缀 ----
    location /static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $mall_real_client_ip;
        proxy_set_header X-Forwarded-For   $mall_real_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
